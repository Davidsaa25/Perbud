<style>
/* VOICE: calm, trustworthy iOS utility — money without stress.
   IDEA: an iOS Settings-style grouped list where the income account pours into envelopes.
   PICTURE: the income ring — a donut of where this month's money goes, savings in green at the centre.
   COLOUR and TYPE: iOS system palette, SF system font, white/black grounds with grouped cards.
   LAYOUT: one column, large title, tab bar at bottom, sheets slide up for edits. */
:root{color-scheme:light dark;
--bg:light-dark(#f2f2f7,#000);--card:light-dark(#fff,#1c1c1e);--card2:light-dark(#f2f2f7,#2c2c2e);
--ink:light-dark(#000,#fff);--ink2:light-dark(#3c3c4399,#ebebf599);--sep:light-dark(#3c3c4329,#54545899);
--blue:light-dark(#007aff,#0a84ff);--green:light-dark(#34c759,#30d158);--red:light-dark(#ff3b30,#ff453a);--orange:light-dark(#ff9500,#ff9f0a);
--fill:light-dark(#78788029,#7878805c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;overflow-x:clip;
padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(84px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
h1{font-size:34px;line-height:1.1;font-weight:700;margin:14px 0 4px;letter-spacing:.2px}
h2{font-size:13px;font-weight:400;color:var(--ink2);margin:24px 16px 6px;text-transform:none}
.sub{color:var(--ink2);font-size:15px;margin:0 0 8px}
.card{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:44px;position:relative;width:100%;background:none;border:0;color:inherit;font:inherit;text-align:start;cursor:pointer}
.row+.row::before{content:"";position:absolute;top:0;left:60px;right:0;border-top:.5px solid var(--sep)}
.row.plain+.row.plain::before{left:16px}
.ic{width:32px;height:32px;border-radius:8px;flex:none;display:grid;place-items:center;color:#fff;font-weight:600;font-size:15px}
.grow{flex:1}.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.muted{color:var(--ink2);font-size:13px}
.bar{height:4px;border-radius:2px;background:var(--fill);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:2px}
.chev{color:var(--ink2);opacity:.6;font-size:20px;line-height:1}
.month{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.month b{font-size:17px;font-weight:600}
.ibtn{width:44px;height:44px;border-radius:22px;border:0;background:var(--card);color:var(--blue);font-size:22px;cursor:pointer}
.hero{padding:18px 16px 16px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center}
.ring{position:relative;width:150px;height:150px}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font-size:21px;line-height:1.2;font-variant-numeric:tabular-nums}.ring .c span{font-size:11px;color:var(--ink2);max-width:100px}
.kv{display:grid;gap:8px}.kv div{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.kv div span:first-child{display:flex;align-items:center;gap:6px;color:var(--ink2)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.kv .tot{border-top:.5px solid var(--sep);padding-top:8px;font-weight:600}.kv .tot span:first-child{color:var(--ink)}
@media(max-width:380px){.hero{grid-template-columns:1fr;justify-items:center}.kv{width:100%}}
.alert{display:flex;gap:10px;padding:12px 14px;border-radius:12px;margin-top:10px;font-size:15px;background:var(--card)}
.alert i{font-style:normal;font-weight:700;width:22px;height:22px;border-radius:11px;display:grid;place-items:center;color:#fff;flex:none;font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chip{flex:none;border:0;background:var(--card);color:var(--blue);border-radius:16px;padding:8px 14px;font:inherit;font-size:15px;cursor:pointer;min-height:36px}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--blue);color:#fff;font:inherit;font-weight:600;padding:15px;cursor:pointer;margin-top:16px}
.btn.sec{background:var(--card);color:var(--blue)}.btn.danger{background:var(--card);color:var(--red)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input,textarea{font:inherit;font-size:17px;color:inherit;background:transparent;border:0;width:100%}
input.amt{text-align:right;font-variant-numeric:tabular-nums}
textarea{background:var(--card);border-radius:12px;padding:12px;min-height:110px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:light-dark(#f9f9f9e6,#161616e6);
backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--sep);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}
.tab{border:0;background:none;color:var(--ink2);font:inherit;font-size:11px;display:grid;justify-items:center;gap:2px;min-width:80px;min-height:44px;cursor:pointer}
.tab svg{width:26px;height:26px}.tab.on{color:var(--blue)}
.veil{position:fixed;inset:0;background:#0006;z-index:10;display:none;align-items:flex-end;justify-content:center}
.veil.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--fill);margin:0 auto 10px}
.shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.shead b{font-size:17px}.link{border:0;background:none;color:var(--blue);font:inherit;padding:10px 4px;cursor:pointer;min-height:44px}
.colors{display:flex;gap:10px;flex-wrap:wrap;padding:12px 16px}
.sw{width:32px;height:32px;border-radius:16px;border:3px solid transparent;cursor:pointer}.sw.on{border-color:var(--ink)}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;width:96px;flex:none}
.seg button{flex:1;border:0;background:none;color:inherit;font:inherit;font-size:14px;border-radius:7px;padding:5px 0;cursor:pointer}
.seg.wide{width:100%;padding:2px}.seg.wide button{padding:7px 0;min-height:32px}.seg button.on{background:var(--card);box-shadow:0 1px 3px #0002}
.chk{width:26px;height:26px;border-radius:13px;border:2px solid var(--fill);flex:none;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:700}.chk.on{background:var(--blue);border-color:var(--blue)}
.fig{position:relative}.fig>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.hist{display:flex;align-items:flex-end;gap:8px;height:150px;padding:16px 16px 0}
.hcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;align-items:stretch;cursor:pointer;background:none;border:0;padding:0}
.hcol .s{background:var(--green);border-radius:4px 4px 0 0}.hcol .b{background:var(--blue);opacity:.35}
.hlab{display:flex;gap:8px;padding:6px 16px 14px}.hlab span{flex:1;text-align:center;font-size:12px;color:var(--ink2)}
.legend{display:flex;gap:16px;padding:0 16px 14px;font-size:13px;color:var(--ink2)}.legend span{display:flex;align-items:center;gap:6px}
.onb{min-height:80vh;display:flex;flex-direction:column}
.logo{width:72px;height:72px;border-radius:18px;background:linear-gradient(160deg,#34c759,#0a8f3c);display:grid;place-items:center;margin-top:40px}
.step{color:var(--ink2);font-size:13px;margin-top:24px}
.big{font-size:40px;font-weight:700;text-align:left;font-variant-numeric:tabular-nums;padding:10px 0}
.foot{text-align:center;color:var(--ink2);font-size:13px;line-height:1.6;padding:8px 16px 24px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:light-dark(#1c1c1ef0,#fffffff0);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:15px;z-index:20;display:none}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs" hidden>
  <button class="tab on" data-tab="mes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5V12l6 6"/></svg>Presupuesto</button>
  <button class="tab" data-tab="hist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Historial</button>
  <button class="tab" data-tab="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>Ajustes</button>
</nav>
<div class="veil" id="veil"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
{
const KEY='perbud.v1';
const COLORS=['#007aff','#34c759','#ff9500','#ff2d55','#af52de','#5ac8fa','#ffcc00','#ff3b30','#5856d6','#a2845e','#00c7be','#8e8e93'];
const SUGG=[['Alquiler / Hipoteca',.28],['Supermercado',.12],['Transporte',.08],['Servicios (luz, agua, internet)',.06],['Teléfono',.03],['Salud / Seguro',.05],['Restaurantes',.05],['Entretenimiento',.04],['Suscripciones',.02],['Deudas / Préstamos',.06],['Educación',.03],['Cuidado personal',.02],['Mascotas',.02],['Regalos',.01],['Imprevistos',.03]];
const VAR_NAMES=/supermercado|transporte|servicios|restaurantes|entretenimiento|cuidado|mascotas|regalos|imprevistos/i;
const typeOf=a=>a.type||(VAR_NAMES.test(a.name)?'variable':'fijo');
const DEFAULT_ON=['Alquiler / Hipoteca','Supermercado','Transporte','Servicios (luz, agua, internet)','Teléfono','Entretenimiento','Imprevistos'];
const $=s=>document.querySelector(s);
const fmt=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:n%1?2:0}).format(n||0);
const pct=(a,b)=>b?Math.round(a/b*100):0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.]/g,''));return isFinite(n)?Math.round(n*100)/100:0};
const uid=()=>Math.random().toString(36).slice(2,9);
const mkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const mname=(k,short)=>{const[y,m]=k.split('-');const t=new Date(y,m-1,1).toLocaleDateString('es',short?{month:'short'}:{month:'long',year:'numeric'});return t[0].toUpperCase()+t.slice(1)};
const shift=(k,n)=>{const[y,m]=k.split('-').map(Number);return mkey(new Date(y,m-1+n,1))};
let S=null,tab='mes',draft=null;
function load(){try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function toast(t){const el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',1800)}
function month(k){
  if(!S.months[k]){const prev=Object.keys(S.months).filter(x=>x<k).sort().pop()||Object.keys(S.months).sort()[0];
    const p=S.months[prev];S.months[k]=p?JSON.parse(JSON.stringify(p)):{income:S.income,goal:S.goal,accounts:[]};delete S.months[k].paid;S.months[k].accounts.forEach(a=>{a.type=typeOf(a);a.spent=null});save()}
  return S.months[k]}
const OCIO='#30b0c7',OSAVE='light-dark(#a7e8b6,#1e5c2c)';
function calc(m){const budget=m.accounts.reduce((a,x)=>a+x.amount,0);const ocio=Math.round((m.income-budget-m.goal)*100)/100;
  const op=m.ocioPct??100;const ocioSpend=ocio>0?Math.round(ocio*op)/100:0;const ocioSave=ocio>0?Math.round((ocio-ocioSpend)*100)/100:0;
  let varLeft=0,varCount=0;m.accounts.forEach(a=>{if(typeOf(a)==='variable'&&a.spent!=null&&a.spent!==''){varLeft+=a.amount-a.spent;varCount++}});varLeft=Math.round(varLeft*100)/100;
  const fixed=m.accounts.filter(a=>typeOf(a)==='fijo').reduce((x,a)=>x+a.amount,0);
  return{budget,fixed,variable:budget-fixed,ocio,ocioSpend,ocioSave,op,left:ocio,varLeft,varCount,planned:m.goal+ocioSave,saving:Math.max(m.goal+ocioSave+varLeft,0),over:ocio<0}}

/* ---------- Onboarding ---------- */
function onboarding(step){
  draft=draft||{income:'',goal:'',goalMode:'$',accs:SUGG.map(([n,p],i)=>({name:n,p,on:DEFAULT_ON.includes(n),amount:null,color:COLORS[i%COLORS.length]}))};
  const d=draft,inc=num(d.income);
  let h='<div class="wrap onb">';
  if(step===0){h+=`<div class="logo"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4v8h8"/></svg></div>
    <h1>Bienvenido a Perbud</h1><p class="sub">Tu ingreso llega a una cuenta. Perbud lo reparte en tus cuentas fijas, tu ahorro fijo y Ocio. Tú defines una meta de ahorro mensual y Perbud te muestra si la cumples.</p>
    <div class="grow"></div><button class="btn" data-go="1">Empezar</button>`}
  if(step===1){h+=`<p class="step">Paso 1 de 3</p><h1>¿Cuánto ingresas al mes?</h1><p class="sub">Tu ingreso neto: lo que realmente entra a tu cuenta después de impuestos y descuentos.</p>
    <div class="card" style="padding:4px 16px"><input class="big" id="inc" inputmode="decimal" placeholder="$0" value="${d.income}" aria-label="Ingreso neto mensual"></div>
    <div class="grow"></div><button class="btn" data-go="2">Continuar</button>`}
  if(step===2){const sug=Math.round(inc*.1);h+=`<p class="step">Paso 2 de 3</p><h1>Tu ahorro fijo</h1><p class="sub">Lo que quieres apartar primero de tu cuenta de ingreso. Lo que sobre después de tus cuentas también se suma a tu ahorro.</p>
    <div class="card"><div class="row plain"><span class="grow">Ahorro fijo mensual</span><div class="seg"><button data-gm="$" class="${d.goalMode==='$'?'on':''}">$</button><button data-gm="%" class="${d.goalMode==='%'?'on':''}">%</button></div></div>
    <div class="row plain"><input class="big" id="goal" inputmode="decimal" placeholder="${d.goalMode==='$'?'$'+sug:'10%'}" value="${d.goal}" aria-label="Ahorro fijo"></div></div>
    <p class="muted" style="margin:8px 16px">De ${fmt(inc)}: una referencia común es ahorrar entre 10% y 20%.</p>
    <div class="grow"></div><button class="btn" data-go="3">Continuar</button><button class="btn sec" data-go="1">Atrás</button>`}
  if(step===3){const goal=goalVal();let used=goal;
    h+=`<p class="step">Paso 3 de 3</p><h1>Tus cuentas</h1><p class="sub">Activa las que uses y ajusta el monto. Podrás crear, renombrar o borrar cuentas cuando quieras.</p><div class="card">`;
    d.accs.forEach((a,i)=>{if(a.amount===null)a.amount=Math.round(inc*a.p);if(a.on)used+=a.amount;
      h+=`<div class="row" style="opacity:${a.on?1:.45}"><button class="ic" style="background:${a.on?a.color:'var(--fill)'};border:0" data-tg="${i}" aria-label="Activar ${esc(a.name)}">${a.on?'✓':''}</button>
      <span class="grow">${esc(a.name)}</span><input class="amt" style="width:96px" inputmode="decimal" data-am="${i}" value="${a.on?fmt(a.amount):''}" placeholder="${fmt(Math.round(inc*a.p))}" ${a.on?'':'disabled'} aria-label="Monto ${esc(a.name)}"></div>`});
    const left=inc-used;
    h+=`</div><div class="alert" style="position:sticky;bottom:12px;box-shadow:0 4px 20px #0002"><i style="background:${left<0?'var(--red)':'var(--green)'}">${left<0?'!':'✓'}</i>
      <span>${left<0?`Te pasas por <b>${fmt(-left)}</b>. Baja algún monto o tu ahorro fijo.`:`Lo que queda va a <b>Ocio: ${fmt(left)}</b>, para tus gastos hormiga. Luego decides cuánto de Ocio ahorrar.`}</span></div>
      <button class="btn" data-go="done">Crear mi presupuesto</button><button class="btn sec" data-go="2">Atrás</button>`}
  h+='</div>';$('#app').innerHTML=h;$('#tabs').hidden=true;
  const inc1=$('#inc');if(inc1){inc1.focus();inc1.oninput=()=>d.income=inc1.value}
  const g=$('#goal');if(g)g.oninput=()=>d.goal=g.value;
  document.querySelectorAll('[data-gm]').forEach(b=>b.onclick=()=>{d.goalMode=b.dataset.gm;d.goal='';onboarding(2)});
  document.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>{const a=d.accs[b.dataset.tg];a.on=!a.on;onboarding(3)});
  document.querySelectorAll('[data-am]').forEach(inp=>inp.onchange=()=>{d.accs[inp.dataset.am].amount=num(inp.value);onboarding(3)});
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const t=b.dataset.go;
    if(t==='2'&&!num(d.income)){toast('Escribe tu ingreso mensual');return}
    if(t==='done'){finish();return} if(t==='3')d.accs.forEach(a=>a.amount=null); onboarding(+t);scrollTo(0,0)});
}
function goalVal(){const d=draft,v=num(d.goal),inc=num(d.income);if(d.goal==='')return Math.round(inc*.1);return d.goalMode==='%'?Math.round(inc*v/100):v}
function finish(){const d=draft,inc=num(d.income),goal=goalVal(),k=mkey(new Date());
  S={income:inc,goal,cur:k,months:{}};
  S.months[k]={income:inc,goal,accounts:d.accs.filter(a=>a.on).map(a=>({id:uid(),name:a.name,amount:a.amount,color:a.color,type:typeOf(a),spent:null}))};
  draft=null;save();render()}

/* ---------- Main ---------- */
function render(){if(!S){onboarding(0);return}$('#tabs').hidden=false;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===tab));
  ({mes:viewMonth,hist:viewHist,ajustes:viewSettings})[tab]();
  $('#app').insertAdjacentHTML('beforeend',`<footer class="foot">© ${new Date().getFullYear()} Perbud. Todos los derechos reservados.<br>App desarrollada por David Saavedra</footer>`)}
function ring(m,c,lab='Ahorro proyectado'){const R=64,C=2*Math.PI*R,tot=Math.max(m.income,c.budget+m.goal)||1;let off=0,segs='';
  const parts=m.accounts.map(a=>[a.amount,a.color]).concat([[c.ocioSpend,OCIO],[m.goal,'var(--green)'],[c.ocioSave,OSAVE]]);
  parts.forEach(([v,col])=>{if(v<=0)return;const L=v/tot*C;segs+=`<circle r="${R}" cx="75" cy="75" fill="none" stroke="${col}" stroke-width="13" stroke-dasharray="${Math.max(L-1.5,.5)} ${C}" stroke-dashoffset="${-off}"/>`;off+=L});
  return`<div class="ring"><svg viewBox="0 0 150 150"><circle r="${R}" cx="75" cy="75" fill="none" stroke="var(--fill)" stroke-width="13"/>${segs}</svg>
  <div class="c"><span>${lab}</span><b style="color:${c.over?'var(--red)':'var(--green)'}">${c.over?'−'+fmt(-c.left):fmt(c.saving)}</b><span>${c.over?'excedido':pct(c.saving,m.income)+'% del ingreso'}</span></div></div>`}
function targetCard(m,c){const t=m.target,s=c.over?0:c.saving;
  if(!t)return`<div class="card" style="margin-top:12px"><button class="row plain" id="eTarget"><span class="ic" style="background:var(--orange)">★</span><span class="grow">Define tu meta de ahorro mensual<div class="muted">Ahorro fijo + ahorro de Ocio</div></span><span class="chev">›</span></button></div>`;
  const ok=s>=t,p=Math.min(s/t*100,100);
  return`<div class="card" style="margin-top:12px"><button class="row plain" id="eTarget" style="display:block">
  <div style="display:flex;justify-content:space-between;gap:8px"><span>Meta de ahorro del mes</span><span class="r"><b style="color:${ok?'var(--green)':'inherit'}">${fmt(s)}</b> <span class="muted">de ${fmt(t)}</span></span></div>
  <div class="bar" style="height:8px;border-radius:4px;margin-top:10px"><i style="width:${p}%;background:${ok?'var(--green)':'var(--orange)'}"></i></div>
  <div class="muted" style="margin-top:6px">${ok?`Meta cumplida${s>t?`, con ${fmt(s-t)} extra`:''} ✓`:`Te faltan ${fmt(t-s)} · ${Math.round(s/t*100)}% de la meta`} · Tocar para editar</div></button></div>`}
function alerts(m,c){const out=[];
  m.accounts.forEach(a=>{if(typeOf(a)==='variable'&&a.spent!=null&&a.spent>a.amount)out.push(['var(--red)','!',`${esc(a.name)} se pasó por <b>${fmt(a.spent-a.amount)}</b>; eso baja tu ahorro proyectado.`])});
  if(m.target&&!c.over&&c.saving<m.target){const need=m.target-m.goal-c.varLeft,canOcio=c.ocio;
    if(need<=0){}else if(need<=canOcio){const sp=Math.floor((100-need/canOcio*100)/5)*5;out.push(['var(--orange)','!',`Para llegar a tu meta de ${fmt(m.target)}, gasta como máximo el ${sp}% de Ocio (ahora ${c.op}%).`])}
    else out.push(['var(--orange)','!',`Aunque ahorres todo Ocio no llegas a tu meta de ${fmt(m.target)}. Baja alguna cuenta fija.`])}
  if(c.budget>m.income)out.push(['var(--red)','!',`Tus cuentas (${fmt(c.budget)}) superan tu ingreso por <b>${fmt(c.budget-m.income)}</b>.`]);
  else if(c.over)out.push(['var(--red)','!',`Con tu ahorro fijo te pasas por <b>${fmt(-c.left)}</b>. Baja alguna cuenta o ajusta el ahorro fijo.`]);
  m.accounts.forEach(a=>{if(/alquiler|hipoteca|vivienda|renta/i.test(a.name)&&a.amount>m.income*.3)out.push(['var(--orange)','!',`${esc(a.name)} usa el ${pct(a.amount,m.income)}% de tu ingreso. Lo recomendado suele ser 30% o menos.`])});
  if(!c.over&&c.ocio<m.income*.03)out.push(['var(--orange)','!',`Ocio queda con solo ${fmt(c.ocio)} para tus gastos hormiga. Revisa tus cuentas.`]);
  if(!c.over&&m.income&&c.saving<m.income*.1)out.push(['var(--orange)','i',`Tu ahorro es ${pct(c.saving,m.income)}% del ingreso. Una referencia común es 10% a 20%.`]);
  if(!out.length)out.push(['var(--green)','✓',`Todo cuadra: tu ahorro proyectado es ${fmt(c.saving)}${c.varLeft>0?`, incluye ${fmt(c.varLeft)} que sobran de gastos variables`:''}.`]);
  return out.map(([col,ic,t])=>`<div class="alert"><i style="background:${col}">${ic}</i><span>${t}</span></div>`).join('')}
function monthHead(k){return`<div class="month"><button class="ibtn" id="prev" aria-label="Mes anterior">‹</button><b>${mname(k)}</b><button class="ibtn" id="next" aria-label="Mes siguiente">›</button></div>
  <div class="seg wide" role="tablist"><button data-v="mes" class="${S.view!=='q'?'on':''}">Mensual</button><button data-v="q" class="${S.view==='q'?'on':''}">Quincenal</button></div>`}
function bindHead(k){$('#prev').onclick=()=>{S.cur=shift(k,-1);month(S.cur);save();render()};
  $('#next').onclick=()=>{S.cur=shift(k,1);month(S.cur);save();render()};
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;save();render()})}
const half=v=>Math.round(v*50)/100;
function qMonth(m,q){const f=v=>q===1?half(v):Math.round((v-half(v))*100)/100;
  return{...m,income:f(m.income),goal:f(m.goal),accounts:m.accounts.map(a=>({...a,amount:f(a.amount),spent:a.spent==null?null:f(a.spent)}))}}
function viewQ(){const k=S.cur,m=month(k);
  if(!S.q){const t=new Date();S.q=t.getDate()>15?2:1}
  const q=S.q,hm=qMonth(m,q),c=calc(hm);m.paid=m.paid||{};const paid=m.paid['q'+q]||[];
  const items=[...hm.accounts].sort((a,b)=>b.amount-a.amount).map(a=>({id:a.id,name:a.name,amount:a.amount,color:a.color,ic:esc(a.name.trim()[0]||'?').toUpperCase()}));
  items.unshift({id:'goal',name:'Ahorro fijo',amount:hm.goal,color:'var(--green)',ic:'$'});
  if(c.ocio>0){items.push({id:'ocio',name:'Ocio · gasto',amount:c.ocioSpend,color:OCIO,ic:'O'});if(c.ocioSave>0)items.push({id:'ocios',name:'Ocio · ahorro',amount:c.ocioSave,color:OSAVE,ic:'O'})}
  const list=items.filter(i=>i.amount>0);const done=list.filter(i=>paid.includes(i.id)).reduce((a,i)=>a+i.amount,0);
  const total=list.reduce((a,i)=>a+i.amount,0);const allDone=list.length&&list.every(i=>paid.includes(i.id));
  const [yy,mm]=k.split('-').map(Number),last=new Date(yy,mm,0).getDate();
  $('#app').innerHTML=`<div class="wrap"><h1>Perbud</h1>${monthHead(k)}
  <div class="seg wide" style="margin-top:8px"><button data-q="1" class="${q===1?'on':''}">1ª quincena · 1–15</button><button data-q="2" class="${q===2?'on':''}">2ª quincena · 16–${last}</button></div>
  <div class="card" style="margin-top:12px"><div class="hero">${ring(hm,c,'Ahorro quincena')}<div class="kv">
    <div><span><i class="dot" style="background:var(--green)"></i>Ingreso</span><span class="r">${fmt(hm.income)}</span></div>
    <div><span>Distribuido</span><span class="r" style="color:var(--blue)">${fmt(done)}</span></div>
    <div><span>Por distribuir</span><span class="r">${fmt(Math.max(total-done,0))}</span></div>
    <div class="tot"><span>Ahorro</span><span class="r" style="color:var(--green)">${fmt(c.over?0:c.saving)}</span></div></div></div>
    <div style="padding:0 16px 16px"><div class="bar" style="height:8px;border-radius:4px"><i style="width:${total?done/total*100:0}%;background:var(--blue)"></i></div>
    <div class="muted" style="margin-top:6px">${allDone?'Quincena distribuida por completo ✓':`${list.filter(i=>paid.includes(i.id)).length} de ${list.length} cuentas listas`}</div></div></div>
  ${c.over?`<div class="alert"><i style="background:var(--red)">!</i><span>Tu presupuesto supera el ingreso por ${fmt(-c.ocio*2)} al mes. Ajústalo en la vista Mensual.</span></div>`:''}
  <h2>CUANDO RECIBAS TU PAGO, ENVÍA A CADA CUENTA</h2><div class="card">
  ${list.map(i=>{const on=paid.includes(i.id);return`<button class="row" data-p="${i.id}" aria-pressed="${on}"><span class="ic" style="background:${i.color}">${i.ic}</span>
    <span class="grow" style="${on?'color:var(--ink2);text-decoration:line-through':''}">${esc(i.name)}</span><span class="r" style="${on?'color:var(--ink2)':''}">${fmt(i.amount)}</span>
    <span class="chk ${on?'on':''}">${on?'✓':''}</span></button>`}).join('')}</div>
  <button class="btn sec" id="all">${allDone?'Desmarcar todo':'Marcar todo como distribuido'}</button>
  <p class="muted" style="margin:16px">Cada quincena es la mitad del presupuesto mensual. Para cambiar montos o crear cuentas, usa la vista Mensual.</p></div>`;
  bindHead(k);
  document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{S.q=+b.dataset.q;save();render()});
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const id=b.dataset.p,arr=m.paid['q'+q]=m.paid['q'+q]||[];const i=arr.indexOf(id);i<0?arr.push(id):arr.splice(i,1);save();render()});
  $('#all').onclick=()=>{m.paid['q'+q]=allDone?[]:list.map(i=>i.id);save();render();if(!allDone)toast('Quincena distribuida')}}
function accRow(a){const m=month(S.cur);const v=typeOf(a)==='variable',has=v&&a.spent!=null;const left=has?a.amount-a.spent:0;
  const sub=v?(has?`Gastado ${fmt(a.spent)} · ${left>=0?'sobran <b style="color:var(--green)">'+fmt(left)+'</b>':'<b style="color:var(--red)">te pasaste '+fmt(-left)+'</b>'}`:'Variable · anota lo gastado'):'Fijo';
  const fill=has?Math.min(a.spent/(a.amount||1)*100,100):Math.min(pct(a.amount,m.income),100);
  return`<button class="row" data-acc="${a.id}"><span class="ic" style="background:${a.color}">${esc(a.name.trim()[0]||'?').toUpperCase()}</span>
    <span class="grow">${esc(a.name)}<div class="muted">${sub}</div><div class="bar"><i style="width:${fill}%;background:${has&&left<0?'var(--red)':a.color}"></i></div></span>
    <span class="r">${fmt(a.amount)}<div class="muted">${pct(a.amount,m.income)}%</div></span><span class="chev">›</span></button>`}
function viewMonth(){if(S.view==='q'){viewQ();return}const k=S.cur,m=month(k),c=calc(m);const names=new Set(m.accounts.map(a=>a.name));
  const accs=[...m.accounts].sort((a,b)=>b.amount-a.amount);
  $('#app').innerHTML=`<div class="wrap"><h1>Perbud</h1>
  ${monthHead(k)}
  <div class="card" style="margin-top:12px"><button class="row plain" id="eInc"><span class="ic" style="background:var(--green)">$</span><span class="grow">Cuenta de ingreso<div class="muted">Ingreso neto mensual</div></span><b class="r">${fmt(m.income)}</b><span class="chev">›</span></button></div>
  <div class="card" style="margin-top:12px"><div class="hero">${ring(m,c)}<div class="kv">
    <div><span><i class="dot" style="background:var(--blue)"></i>Cuentas</span><span class="r">${fmt(c.budget)}</span></div>
    <div><span><i class="dot" style="background:var(--green)"></i>Ahorro fijo</span><span class="r">${fmt(m.goal)}</span></div>
    <div><span><i class="dot" style="background:${OCIO}"></i>Ocio</span><span class="r" style="color:${c.over?'var(--red)':'inherit'}">${c.over?fmt(c.ocio):fmt(c.ocioSpend)}</span></div>
    <div><span><i class="dot" style="background:${OSAVE}"></i>Ahorro ocio</span><span class="r">${fmt(c.ocioSave)}</span></div>
    ${c.varCount?`<div><span><i class="dot" style="background:${c.varLeft<0?'var(--red)':'#7ed6a0'}"></i>Variables</span><span class="r" style="color:${c.varLeft<0?'var(--red)':'inherit'}">${fmt(c.varLeft)}</span></div>`:''}
    <div class="tot"><span>Proyectado</span><span class="r" style="color:var(--green)">${fmt(c.over?0:c.saving)}</span></div></div></div>
    <button class="row plain" id="eGoal" style="border-top:.5px solid var(--sep)"><span class="grow" style="color:var(--blue)">Editar ahorro fijo</span><span class="chev">›</span></button></div>
  ${targetCard(m,c)}
  ${alerts(m,c)}
  ${['fijo','variable'].map(t=>{const g=accs.filter(a=>typeOf(a)===t);if(!g.length)return'';
    return`<h2>${t==='fijo'?'GASTOS FIJOS':'GASTOS VARIABLES'} · ${fmt(g.reduce((x,a)=>x+a.amount,0))}</h2><div class="card">${g.map(accRow).join('')}</div>`}).join('')}
  <h2>OCIO Y NUEVAS CUENTAS</h2><div class="card">
  <button class="row" id="ocio"><span class="ic" style="background:${OCIO}">O</span>
    <span class="grow">Ocio<div class="muted">${c.over?'Sin dinero disponible':`Gastas ${c.op}% · ahorras ${100-c.op}%`}</div><div class="bar"><i style="width:${c.ocio>0?100-c.op:0}%;background:var(--green)"></i></div></span>
    <span class="r" style="color:${c.over?'var(--red)':'inherit'}">${fmt(c.ocio)}<div class="muted">${pct(Math.max(c.ocio,0),m.income)}%</div></span><span class="chev">›</span></button>
  <button class="row" id="add"><span class="ic" style="background:var(--blue)">+</span><span class="grow" style="color:var(--blue)">Nueva cuenta</span></button></div>
  ${SUGG.some(([n])=>!names.has(n))?`<h2>SUGERENCIAS</h2><div class="chips">${SUGG.filter(([n])=>!names.has(n)).map(([n,p])=>`<button class="chip" data-sg="${esc(n)}" data-p="${p}">+ ${esc(n)}</button>`).join('')}</div>`:''}
  <p class="muted" style="margin:16px">Los cambios aplican a ${mname(k).toLowerCase()}. Cada mes nuevo copia el anterior.</p></div>`;
  bindHead(k);
  $('#eInc').onclick=()=>sheetMoney('Cuenta de ingreso','Ingreso neto de '+mname(k),m.income,v=>{m.income=v;S.income=v});
  $('#eGoal').onclick=()=>sheetMoney('Ahorro fijo','Lo que apartas primero de tu ingreso',m.goal,v=>{m.goal=v;S.goal=v},true);
  $('#add').onclick=()=>sheetAcc(null);
  $('#ocio').onclick=()=>sheetOcio(m);
  $('#eTarget').onclick=()=>sheetMoney('Meta de ahorro mensual','Cuánto quieres ahorrar en total este mes: ahorro fijo + ahorro de Ocio',m.target||Math.round(m.income*.2),v=>{m.target=v;S.target=v},true);
  document.querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>sheetAcc(m.accounts.find(a=>a.id===b.dataset.acc)));
  document.querySelectorAll('[data-sg]').forEach(b=>b.onclick=()=>sheetAcc({name:b.dataset.sg,amount:Math.round(m.income*b.dataset.p),color:COLORS[m.accounts.length%COLORS.length]},true));
}

/* ---------- Sheets ---------- */
function sheetOcio(m){let op=m.ocioPct??100;
  const draw=()=>{const c=calc({...m,ocioPct:op});
  openSheet(`<div class="shead"><button class="link" id="x">Cancelar</button><b>Ocio</b><button class="link" id="ok"><b>Guardar</b></button></div>
  <p class="muted" style="margin:0 16px 10px">Ocio es lo que queda de tu ingreso después de las cuentas fijas y el ahorro fijo. Aquí van los gastos hormiga: café, antojos, salidas. Decide cuánto gastar; el resto se ahorra.</p>
  <div class="card"><div class="row plain"><span class="grow">Disponible en Ocio</span><b class="r" style="color:${c.over?'var(--red)':'inherit'}">${fmt(c.ocio)}</b></div>
  ${c.over?'<div class="row plain muted">Tus cuentas y tu ahorro fijo ya usan todo tu ingreso. Libera dinero para tener Ocio.</div>':`
  <div class="row plain" style="display:block"><div style="display:flex;justify-content:space-between"><span>Voy a gastar</span><b class="r" id="pv">${op}%</b></div>
   <input type="range" id="rg" min="0" max="100" step="5" value="${op}" style="margin:14px 0 4px;accent-color:${OCIO}" aria-label="Porcentaje de Ocio para gastar"></div>
  <div class="row plain"><span class="grow">Gasto en Ocio</span><span class="r">${fmt(c.ocioSpend)}</span></div>
  <div class="row plain"><span class="grow">Ahorro desde Ocio</span><b class="r" style="color:var(--green)">${fmt(c.ocioSave)}</b></div>
  <div class="row plain"><span class="grow">Ahorro total del mes</span><b class="r" style="color:var(--green)">${fmt(c.saving)}</b></div>`}</div>
  ${c.over?'':`<p class="muted" style="margin:8px 16px">Unos ${fmt(c.ocioSpend/4.3)} por semana para gastos hormiga.</p>`}`);
  $('#x').onclick=closeSheet;const rg=$('#rg');if(rg)rg.oninput=()=>{op=+rg.value;draw()};
  $('#ok').onclick=()=>{m.ocioPct=op;save();closeSheet();render();toast('Ocio actualizado')}};draw()}
function openSheet(html){$('#sheet').innerHTML='<div class="grab"></div>'+html;$('#veil').classList.add('open')}
function closeSheet(){$('#veil').classList.remove('open')}
$('#veil').onclick=e=>{if(e.target.id==='veil')closeSheet()};
function sheetMoney(title,sub,val,set,allowPct){const m=month(S.cur);let mode='$';
  const draw=()=>{openSheet(`<div class="shead"><button class="link" id="x">Cancelar</button><b>${title}</b><button class="link" id="ok"><b>Guardar</b></button></div>
  <p class="muted" style="margin:0 16px 8px">${sub}</p><div class="card"><div class="row plain">${allowPct?`<div class="seg"><button data-m="$" class="${mode==='$'?'on':''}">$</button><button data-m="%" class="${mode==='%'?'on':''}">%</button></div>`:''}
  <input class="big amt" id="v" inputmode="decimal" value="${mode==='$'?val:pct(val,m.income)}" aria-label="${title}"></div></div>
  ${allowPct?`<p class="muted" style="margin:8px 16px">${mode==='%'?'Porcentaje de '+fmt(m.income):''}</p>`:''}`);
  $('#x').onclick=closeSheet;const v=$('#v');v.focus();v.select();
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{val=mode==='%'?Math.round(m.income*num(v.value)/100):num(v.value);mode=b.dataset.m;draw()});
  $('#ok').onclick=()=>{const n=num(v.value);set(mode==='%'?Math.round(m.income*n/100):n);save();closeSheet();render()}};draw()}
function sheetAcc(a,isNew){const m=month(S.cur);isNew=isNew||!a;const d=a?{...a}:{name:'',amount:0,color:COLORS[m.accounts.length%COLORS.length]};let mode='$';d.type=typeOf(d);
  const draw=()=>{openSheet(`<div class="shead"><button class="link" id="x">Cancelar</button><b>${isNew?'Nueva cuenta':'Editar cuenta'}</b><button class="link" id="ok"><b>${isNew?'Agregar':'Guardar'}</b></button></div>
  <div class="card"><div class="row plain"><input id="n" placeholder="Nombre (ej. Gimnasio)" value="${esc(d.name)}" maxlength="40" aria-label="Nombre de la cuenta"></div>
  <div class="row plain"><span class="grow">Presupuesto mensual</span><div class="seg"><button data-m="$" class="${mode==='$'?'on':''}">$</button><button data-m="%" class="${mode==='%'?'on':''}">%</button></div></div>
  <div class="row plain"><input class="big amt" id="v" inputmode="decimal" value="${mode==='$'?d.amount:pct(d.amount,m.income)}" aria-label="Monto"></div></div>
  <p class="muted" style="margin:8px 16px">${mode==='%'?'Porcentaje de tu ingreso de '+fmt(m.income):'Equivale al '+pct(d.amount,m.income)+'% de tu ingreso'}</p>
  <h2>TIPO DE GASTO</h2><div class="card"><div class="row plain"><div class="seg wide"><button data-t="fijo" class="${d.type==='fijo'?'on':''}">Fijo</button><button data-t="variable" class="${d.type==='variable'?'on':''}">Variable</button></div></div>
  ${d.type==='variable'?`<div class="row plain"><span class="grow">Gastado este mes</span><input class="amt" id="sp" style="width:120px" inputmode="decimal" placeholder="$0" value="${d.spent??''}" aria-label="Gastado este mes"></div>`:''}</div>
  <p class="muted" style="margin:8px 16px">${d.type==='fijo'?'Siempre cuesta lo mismo, como el alquiler o el teléfono.':'Puede variar, como el supermercado. Anota lo que llevas gastado y lo que sobre del presupuesto se suma a tu ahorro proyectado del mes.'}</p>
  <h2>COLOR</h2><div class="card"><div class="colors">${COLORS.map(c=>`<button class="sw ${c===d.color?'on':''}" style="background:${c}" data-c="${c}" aria-label="Color ${c}"></button>`).join('')}</div></div>
  ${isNew?'':'<button class="btn danger" id="del">Eliminar cuenta</button>'}`);
  const n=$('#n'),v=$('#v');if(isNew&&!d.name)n.focus();
  const sync=()=>{d.name=n.value;d.amount=mode==='%'?Math.round(m.income*num(v.value)/100):num(v.value);const sp=$('#sp');if(sp)d.spent=sp.value.trim()===''?null:num(sp.value)};
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{sync();d.type=b.dataset.t;draw()});
  $('#x').onclick=closeSheet;
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{sync();mode=b.dataset.m;draw()});
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{sync();d.color=b.dataset.c;draw()});
  $('#ok').onclick=()=>{sync();if(!d.name.trim()){toast('Ponle un nombre a la cuenta');return}
    const spent=d.type==='variable'?(d.spent??null):null;
    if(isNew)m.accounts.push({id:uid(),name:d.name.trim(),amount:d.amount,color:d.color,type:d.type,spent});else Object.assign(a,{name:d.name.trim(),amount:d.amount,color:d.color,type:d.type,spent});
    save();closeSheet();render();toast(isNew?'Cuenta agregada':'Cuenta guardada')};
  const del=$('#del');if(del)del.onclick=()=>{if(del.dataset.sure){m.accounts=m.accounts.filter(x=>x.id!==a.id);save();closeSheet();render();toast('Cuenta eliminada')}else{del.dataset.sure=1;del.textContent='Toca de nuevo para eliminar'}}};
  draw()}

/* ---------- History ---------- */
let roH=null;
const sm=v=>Math.abs(v)>=1000?'$'+(v/1000).toFixed(1).replace('.0','')+'k':'$'+Math.round(v);
function viewHist(){const keys=Object.keys(S.months).sort();
  const rows=keys.map(k=>{const m=S.months[k],c=calc(m);const sav=c.over?0:c.saving,g=Math.min(c.over?0:m.goal,sav),o=Math.min(c.over?0:c.ocioSave,sav-g);return{k,m,c,g,o,v:Math.max(sav-g-o,0),sav,t:m.target||0}});
  let acc=0;rows.forEach(r=>{acc+=r.sav;r.acc=acc});
  const met=rows.filter(r=>r.t&&r.sav>=r.t).length,withT=rows.filter(r=>r.t).length;
  const last=rows.slice(-12);
  $('#app').innerHTML=`<div class="wrap"><h1>Historial</h1>
  <div class="card" style="padding:16px"><div class="muted">Ahorro acumulado</div><div style="font-size:34px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums">${fmt(acc)}</div>
  <div class="muted">${keys.length} ${keys.length===1?'mes':'meses'}${withT?` · meta cumplida en ${met} de ${withT}`:''}</div></div>
  <h2>AHORRO MES A MES</h2><div class="card"><div class="fig" style="min-height:220px"><svg id="ch1" role="img" aria-label="Ahorro por mes"></svg></div>
  <div class="legend" style="flex-wrap:wrap"><span><i class="dot" style="background:var(--green)"></i>Ahorro fijo</span><span><i class="dot" style="background:${OSAVE}"></i>Ahorro de Ocio</span><span><i class="dot" style="background:#7ed6a0"></i>Sobra variables</span><span><i style="width:14px;border-top:2px dashed var(--orange)"></i>Meta</span></div></div>
  <h2>AHORRO ACUMULADO</h2><div class="card"><div class="fig" style="min-height:180px"><svg id="ch2" role="img" aria-label="Ahorro acumulado"></svg></div></div>
  <h2>POR MES</h2><div class="card">${[...rows].reverse().map(r=>`<button class="row plain" data-k="${r.k}"><span class="grow">${mname(r.k)}<div class="muted">${r.t?`Meta ${fmt(r.t)} · ${r.sav>=r.t?'cumplida ✓':'faltaron '+fmt(r.t-r.sav)}`:'Sin meta'}</div></span>
    <span class="r" style="color:${r.c.over?'var(--red)':'var(--green)'}">${r.c.over?'Excedido':fmt(r.sav)}<div class="muted">${r.c.over?fmt(r.c.left):pct(r.sav,r.m.income)+'% del ingreso'}</div></span><span class="chev">›</span></button>`).join('')}</div>
  <p class="muted" style="margin:16px">Montos planificados según tu presupuesto. Toca un mes para abrirlo.</p></div>`;
  const s1=$('#ch1'),s2=$('#ch2');
  const draw=()=>{drawBars(s1,last);drawLine(s2,last)};
  if(roH)roH.disconnect();roH=new ResizeObserver(draw);roH.observe(s1);
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{S.cur=b.dataset.k;save();tab='mes';render();scrollTo(0,0)})}
function drawBars(svg,rows){const W=svg.clientWidth,H=svg.clientHeight;if(!W)return;const L=12,Rt=12,T=24,B=26,n=rows.length;
  const max=Math.max(...rows.map(r=>Math.max(r.sav,r.t)),1)*1.12,y=v=>T+(H-T-B)*(1-v/max),bw=(W-L-Rt)/n,w=Math.min(bw*.6,40);let h='';
  rows.forEach((r,i)=>{const cx=L+bw*i+bw/2,x=cx-w/2;
    h+=`<rect x="${x}" y="${y(r.g)}" width="${w}" height="${y(0)-y(r.g)}" rx="3" style="fill:var(--green)"/>`;
    if(r.o>0)h+=`<rect x="${x}" y="${y(r.g+r.o)}" width="${w}" height="${y(r.g)-y(r.g+r.o)-1}" rx="3" style="fill:${OSAVE}"/>`;
    if(r.v>0)h+=`<rect x="${x}" y="${y(r.sav)}" width="${w}" height="${Math.max(y(r.g+r.o)-y(r.sav)-1,1)}" rx="3" style="fill:#7ed6a0;opacity:.9"/>`;
    if(r.t)h+=`<line x1="${cx-bw*.42}" x2="${cx+bw*.42}" y1="${y(r.t)}" y2="${y(r.t)}" style="stroke:var(--orange)" stroke-width="2" stroke-dasharray="4 3"/>`;
    if(bw>=34)h+=`<text x="${cx}" y="${(r.t&&Math.abs(y(r.sav)-y(r.t))<16)?Math.min(y(r.sav),y(r.t))-6:y(r.sav)-6}" text-anchor="middle" style="fill:var(--ink);font-size:11px;font-weight:600">${sm(r.sav)}</text>`;
    if(bw>=26||i%2===n%2-1+1)h+=`<text x="${cx}" y="${H-8}" text-anchor="middle" style="fill:var(--ink2);font-size:11px">${mname(r.k,1).replace('.','').slice(0,3)}</text>`});
  h+=`<line x1="${L}" x2="${W-Rt}" y1="${y(0)}" y2="${y(0)}" style="stroke:var(--sep)"/>`;svg.innerHTML=h}
function drawLine(svg,rows){const W=svg.clientWidth,H=svg.clientHeight;if(!W)return;const L=16,Rt=16,T=26,B=26,n=rows.length;
  const max=Math.max(...rows.map(r=>r.acc),1)*1.1,bw=(W-L-Rt)/n,x=i=>L+bw*i+bw/2,y=v=>T+(H-T-B)*(1-v/max);
  const pts=rows.map((r,i)=>[x(i),y(r.acc)]);let h='';
  if(n>1)h+=`<path d="M${pts[0][0]},${y(0)}L${pts.map(p=>p.join(',')).join('L')}L${pts[n-1][0]},${y(0)}Z" style="fill:var(--green);opacity:.15"/><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" style="stroke:var(--green)" stroke-width="2.5" stroke-linejoin="round"/>`;
  pts.forEach(([a,b],i)=>{h+=`<circle cx="${a}" cy="${b}" r="${i===n-1?5:3}" style="fill:var(--green);stroke:var(--card)" stroke-width="2"/>`;
    if(bw>=26)h+=`<text x="${a}" y="${H-8}" text-anchor="middle" style="fill:var(--ink2);font-size:11px">${mname(rows[i].k,1).replace('.','').slice(0,3)}</text>`});
  const lp=pts[n-1];h+=`<text x="${Math.min(Math.max(lp[0],30),W-30)}" y="${lp[1]-10}" text-anchor="middle" style="fill:var(--green);font-size:12px;font-weight:700">${sm(rows[n-1].acc)}</text>`;
  h+=`<line x1="${L}" x2="${W-Rt}" y1="${y(0)}" y2="${y(0)}" style="stroke:var(--sep)"/>`;svg.innerHTML=h}

/* ---------- Settings ---------- */
function viewSettings(){$('#app').innerHTML=`<div class="wrap"><h1>Ajustes</h1>
  <h2>INSTALAR EN TU IPHONE</h2><div class="card"><div class="row plain"><span class="muted" style="font-size:15px">En Safari, toca Compartir y luego "Agregar a pantalla de inicio". Perbud se abrirá como una app, a pantalla completa.</span></div></div>
  <h2>TUS DATOS</h2><div class="card">
   <button class="row plain" id="exp"><span class="grow" style="color:var(--blue)">Copiar respaldo</span></button>
   <button class="row plain" id="imp"><span class="grow" style="color:var(--blue)">Restaurar respaldo</span></button></div>
  <p class="muted" style="margin:8px 16px">Tus datos se guardan solo en este teléfono. Copia un respaldo de vez en cuando y guárdalo en Notas.</p>
  <button class="btn danger" id="reset">Borrar todo y empezar de nuevo</button>
  <p class="muted" style="margin:24px 16px;text-align:center">Perbud · versión 0.1</p></div>`;
  $('#exp').onclick=async()=>{const t=JSON.stringify(S);try{await navigator.clipboard.writeText(t);toast('Respaldo copiado')}catch(e){openSheet(`<div class="shead"><span></span><b>Respaldo</b><button class="link" id="x">Listo</button></div><p class="muted">Selecciona y copia este texto:</p><textarea readonly>${esc(t)}</textarea>`);$('#x').onclick=closeSheet}};
  $('#imp').onclick=()=>{openSheet(`<div class="shead"><button class="link" id="x">Cancelar</button><b>Restaurar</b><button class="link" id="ok"><b>Restaurar</b></button></div><p class="muted">Pega tu respaldo. Reemplazará los datos actuales.</p><textarea id="t" aria-label="Respaldo"></textarea>`);
    $('#x').onclick=closeSheet;$('#ok').onclick=()=>{try{const o=JSON.parse($('#t').value);if(!o.months)throw 0;S=o;S.cur=S.cur||Object.keys(S.months).sort().pop();save();closeSheet();tab='mes';render();toast('Datos restaurados')}catch(e){toast('El respaldo no es válido')}}};
  const r=$('#reset');r.onclick=()=>{if(r.dataset.sure){try{localStorage.removeItem(KEY)}catch(e){}S=null;tab='mes';render()}else{r.dataset.sure=1;r.textContent='Toca de nuevo para borrar todo'}}}

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{tab=t.dataset.tab;render();scrollTo(0,0)});
load();if(S){const now=mkey(new Date());if(!S.months[now]&&Object.keys(S.months).some(k=>k<now))month(now);if(!S.cur)S.cur=now}
render();
}
</script>
</body>
</html>
